name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    name: Build & E2E (offline mode)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # SQLite path is resolved relative to prisma/schema.prisma -> prisma/dev.db
      DATABASE_URL: 'file:./dev.db'
      # CI-only signing key; never reuse this outside the runner.
      AUTH_SECRET: 'ci-only-secret-0123456789abcdef0123456789abcdef'
      NEXT_TELEMETRY_DISABLED: '1'
      # Empty key => deterministic offline mode (bundled dictionary + rules).
      # Add LLM_API_KEY as a repository secret and map it here to test the LLM path too.
      LLM_API_KEY: ''
      LIBRETRANSLATE_URL: ''
      MAX_UPLOAD_MB: '50'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize database
        run: npm run db:push

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Generate sample PDF
        run: npm run sample:pdf

      - name: Start server
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              echo "server ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become ready in 120s"
          tail -n 120 server.log
          exit 1

      - name: Run E2E acceptance test
        run: npm run e2e 2>&1 | tee e2e.log

      - name: Start server with unreachable LLM
        run: |
          LLM_API_KEY=ci-placeholder \
          LLM_BASE_URL=http://127.0.0.1:9/v1 \
          LLM_TIMEOUT_MS=2000 \
          PORT=3001 \
          nohup npm start > server-llm.log 2>&1 &
          echo $! > server-llm.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/login > /dev/null; then
              echo "llm server ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "llm server did not become ready in 120s"
          tail -n 120 server-llm.log
          exit 1

      - name: Run LLM fallback checks
        run: BASE_URL=http://127.0.0.1:3001 node scripts/check-llm-fallback.mjs 2>&1 | tee llm-check.log

      - name: Stop servers
        if: always()
        run: |
          for pidfile in server.pid server-llm.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            server.log
            server-llm.log
            e2e.log
            llm-check.log
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "### E2E result" >> "$GITHUB_STEP_SUMMARY"
          if [ -f e2e.log ]; then
            tail -n 25 e2e.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "e2e.log not found (test step did not run)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### LLM fallback result" >> "$GITHUB_STEP_SUMMARY"
          if [ -f llm-check.log ]; then
            tail -n 12 llm-check.log >> "$GITHUB_STEP_SUMMARY"
          fi
